[project]
name = "memory-bench"
version = "0.1.0"
description = "Longitudinal benchmark comparing rolling ADK sessions, keyword memory, local SQLite vector RAG, and consolidated fact memory modeled on Vertex AI Memory Bank."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.14.0,<3.0.0",
    "google-genai>=2.34.0,<3.0.0",
    "aiosqlite>=0.21.0,<1.0.0",
    "pydantic>=2.14.0,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
]

[project.optional-dependencies]
vertex = [
    "google-cloud-agentplatform[agent-engines]>=2.2.0,<3.0.0",
]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "ruff>=0.15.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
