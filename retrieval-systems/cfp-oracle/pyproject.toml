[project]
name = "cfp-oracle"
version = "0.1.0"
description = "Semantic search over 36 historical College Football Playoff and BCS bowl games using Amazon S3 Vectors, Bedrock Titan Text Embeddings V2, and Pydantic v2."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.42.0,<2.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.8.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
